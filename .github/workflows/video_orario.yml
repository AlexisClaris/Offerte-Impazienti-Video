name: Video offerta ogni ora

on:
  schedule:
    - cron: "17 * * * *"   # ogni ora al minuto 17 (orario UTC)
  workflow_dispatch:        # pulsante "Run workflow" per provarlo a mano

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa librerie, ffmpeg e font
        run: |
          pip install pillow requests imageio-ffmpeg
          mkdir -p fonts
          curl -sSL --retry 3 -o inter.zip https://github.com/rsms/inter/releases/download/v4.1/Inter-4.1.zip || true
          unzip -q -o inter.zip -d /tmp/inter 2>/dev/null || true
          find /tmp/inter -name "Inter-*.otf" -exec cp {} fonts/ \; 2>/dev/null || true
          ls fonts

      - name: Crea e invia il video
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python invia_video.py
